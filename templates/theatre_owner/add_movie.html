{% extends "theatre_owner/base_owner.html" %}
{% block title %}Add Movie – CineVerse{% endblock %}
{% block page_title %}Add Movie{% endblock %}
{% block content %}
<style>
.am-wrap{max-width:760px;margin:0 auto;padding:28px 20px;}
.am-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:28px;}
.am-section-title{font-size:.6rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.am-section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07);}
.form-label{font-size:.78rem;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:5px;}
.form-control,.form-select{background:rgba(255,255,255,0.05)!important;border:1px solid rgba(255,255,255,0.1)!important;color:#fff!important;border-radius:8px;font-size:.88rem;}
.form-control:focus,.form-select:focus{background:rgba(255,255,255,0.07)!important;border-color:rgba(99,102,241,0.5)!important;box-shadow:0 0 0 3px rgba(99,102,241,0.12)!important;}
.form-select option{background:#1a1a2e;color:#fff;}
.am-submit{background:linear-gradient(135deg,#6366f1,#4f46e5);border:none;border-radius:10px;padding:12px 32px;color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(99,102,241,0.35);}
.am-submit:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,0.45);}
.am-city-group{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.am-city-group{grid-template-columns:1fr;}}
.loading-spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#6366f1;border-radius:50%;animation:spin .6s linear infinite;margin-left:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<div class="am-wrap">
  <div class="d-flex align-items-center gap-3 mb-4">
    <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 4px 16px rgba(99,102,241,0.4);">🎬</div>
    <div>
      <h4 class="mb-0 fw-bold">Add New Movie</h4>
      <p class="text-muted small mb-0">Submit a new movie to show at your theatre</p>
    </div>
  </div>

  <div class="am-card">
    <form method="POST" action="/theatre-owner/add-movie-submit" id="addMovieForm">

      <!-- MOVIE INFO -->
      <div class="am-section-title"><i class="fas fa-film" style="color:#6366f1;"></i> Movie Information</div>
      <div class="row g-3 mb-4">
        <div class="col-12">
          <label class="form-label">Movie Title *</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Kalki 2898 AD" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Genre *</label>
          <select name="genre" class="form-select" required>
            <option value="">Select Genre</option>
            <option>Action</option><option>Comedy</option><option>Drama</option>
            <option>Horror</option><option>Romance</option><option>Sci-Fi</option>
            <option>Thriller</option><option>Animation</option><option>Biography</option><option>Fantasy</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Language *</label>
          <select name="language" class="form-select" required>
            <option value="">Select Language</option>
            <option>Hindi</option><option>English</option><option>Telugu</option>
            <option>Tamil</option><option>Kannada</option><option>Malayalam</option>
            <option>Bengali</option><option>Marathi</option><option>Punjabi</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Duration (minutes) *</label>
          <input type="number" name="duration" class="form-control" placeholder="e.g. 155" min="60" max="300" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Release Date *</label>
          <input type="date" name="release_date" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Brief synopsis of the movie..."></textarea>
        </div>
      </div>

      <!-- THEATRE & SHOW -->
      <div class="am-section-title"><i class="fas fa-building" style="color:#6366f1;"></i> Theatre & Show Details</div>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label">Select Theatre *</label>
          <select name="theatre_id" class="form-select" required>
            <option value="">Choose Theatre</option>
            {% for t in theatres %}
            <option value="{{ t.theater_id }}">{{ t.name }} ({{ t.city }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Ticket Price (₹) *</label>
          <input type="number" name="price" class="form-control" placeholder="e.g. 250" min="50" max="2000" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Show Date *</label>
          <input type="date" name="show_date" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Show Time *</label>
          <input type="time" name="show_time" class="form-control" required>
        </div>
      </div>

      <!-- LOCATION WITH API DROPDOWNS -->
      <div class="am-section-title"><i class="fas fa-map-marker-alt" style="color:#6366f1;"></i> Location</div>
      <div class="am-city-group mb-4">
        <div>
          <label class="form-label">State *
            <span class="loading-spinner" id="stateSpinner"></span>
          </label>
          <select name="state" id="stateSelect" class="form-select" required onchange="loadCities(this.value)">
            <option value="">Loading states…</option>
          </select>
        </div>
        <div>
          <label class="form-label">City *
            <span class="loading-spinner" id="citySpinner"></span>
          </label>
          <select name="city" id="citySelect" class="form-select" required>
            <option value="">Select State First</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="reset" class="btn btn-outline-secondary">Reset</button>
        <button type="submit" class="am-submit"><i class="fas fa-plus-circle me-2"></i>Submit Movie</button>
      </div>
    </form>
  </div>
</div>

<script>
// Load states on page load
async function loadStates(){
  const spinner = document.getElementById('stateSpinner');
  spinner.style.display='inline-block';
  try{
    const res = await fetch('/theatre-owner/api/states');
    const data = await res.json();
    const sel = document.getElementById('stateSelect');
    sel.innerHTML = '<option value="">Select State</option>';
    data.states.forEach(s => sel.innerHTML += `<option value="${s}">${s}</option>`);
  } catch(e){ console.error(e); }
  spinner.style.display='none';
}

async function loadCities(state){
  if(!state) return;
  const spinner = document.getElementById('citySpinner');
  const sel = document.getElementById('citySelect');
  spinner.style.display='inline-block';
  sel.innerHTML = '<option value="">Loading…</option>';
  try{
    const res = await fetch(`/theatre-owner/api/cities/${encodeURIComponent(state)}`);
    const data = await res.json();
    sel.innerHTML = '<option value="">Select City</option>';
    data.cities.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
  } catch(e){ sel.innerHTML = '<option value="">Error loading</option>'; }
  spinner.style.display='none';
}

loadStates();
</script>
{% endblock %}
