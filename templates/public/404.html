<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 – CineVerse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:40px;position:relative;">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,45,85,0.1) 0%,transparent 70%);pointer-events:none"></div>
  <div style="font-family:'Bebas Neue',sans-serif;font-size:10rem;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,45,85,0.5);margin-bottom:-20px">404</div>
  <h2 style="font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px;color:#fff;margin-bottom:12px">PAGE NOT FOUND</h2>
  <p style="color:rgba(255,255,255,0.45);margin-bottom:32px;max-width:400px">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('public.home') }}" style="display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#ff2d55,#ff6b6b);color:#fff;padding:12px 28px;border-radius:25px;font-weight:700;text-decoration:none;box-shadow:0 4px 20px rgba(255,45,85,0.4)">
    <i class="fas fa-home"></i> Back to Home
  </a>
</div>
</body>
</html>
